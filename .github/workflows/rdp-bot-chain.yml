name: RDP Trading Bot Chain (Tailscale + Memory Persistence)

permissions:
  contents: read
  actions: write

on:
  workflow_dispatch:
    inputs:
      chain_count:
        description: "Number of consecutive sessions to run (e.g., 2 = ~11 hours)"
        required: false
        default: "1"
  schedule:
    - cron: "0 */6 * * *"

jobs:
  run-rdp-bot:
    runs-on: windows-2022
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore bot memory and context from previous run
        uses: actions/download-artifact@v4
        with:
          name: bot-memory-state
          path: C:\PolymarketBot_Platform\backend
        continue-on-error: true

      - name: Connect Tailscale and prepare environment
        shell: pwsh
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          $ErrorActionPreference = "Stop"

          # 1. تفعيل Remote Desktop وتعيين كلمة المرور لحساب runneradmin
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue
          $pass = ConvertTo-SecureString "Mas@11221122" -AsPlainText -Force
          Set-LocalUser -Name "runneradmin" -Password $pass
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "runneradmin" -ErrorAction SilentlyContinue

          # 2. تثبيت وتشغيل Tailscale والربط بشبكتك الخاصة
          $tsExe = "C:\Program Files\Tailscale\tailscale.exe"
          if (-not (Test-Path $tsExe)) {
            choco install tailscale -y --no-progress
          }

          $env:Path = [System.Environment]::GetEnvironmentVariable("Path", "Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path", "User")
          if (-not (Test-Path $tsExe)) {
            $cmdTs = Get-Command tailscale.exe -ErrorAction SilentlyContinue
            if ($cmdTs) { $tsExe = $cmdTs.Source }
          }
          if (-not (Test-Path $tsExe)) {
            throw "tailscale.exe not found after installation."
          }

          Start-Service tailscaled -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3
          & $tsExe up --authkey="$env:TS_AUTHKEY" --hostname="rdp-gold-bot" --accept-dns=true

          # 3. التأكد من وجود Python 3.12 لبيئة MetaTrader5
          if (-not (Test-Path "C:\Python312\python.exe")) {
            choco install python312 -y --no-progress
          }

          # 4. تجهيز مجلد الحفظ ونسخ ملفات الذاكرة المسترجعة إليه
          $srcMem = "C:\PolymarketBot_Platform\backend\trade_memory.json"
          $srcCtx = "C:\PolymarketBot_Platform\backend\open_context.json"
          $dstDir = "C:\Users\RDP\Desktop\MyProject\backend"
          if (-not (Test-Path $dstDir)) {
            New-Item -ItemType Directory -Path $dstDir -Force | Out-Null
          }
          if (Test-Path $srcMem) {
            Copy-Item -Path $srcMem -Destination "$dstDir\trade_memory.json" -Force
          }
          if (Test-Path $srcCtx) {
            Copy-Item -Path $srcCtx -Destination "$dstDir\open_context.json" -Force
          }

          # 5. تشغيل سكربت الإعداد الأساسي إن وجد
          $setupBat = "C:\Users\RDP\Desktop\MyProject\setup_and_run.bat"
          if (Test-Path $setupBat) {
            Start-Process -FilePath "cmd.exe" -ArgumentList "/c", "`"$setupBat`""
          }

      - name: Keep RDP session alive and sync memory before timeout
        shell: pwsh
        run: |
          $maxSeconds = 335 * 60
          $elapsed = 0
          while ($elapsed -lt $maxSeconds) {
            Start-Sleep -Seconds 60
            $elapsed += 60

            $srcMem = "C:\PolymarketBot_Platform\backend\trade_memory.json"
            $srcCtx = "C:\PolymarketBot_Platform\backend\open_context.json"
            $dstDir = "C:\Users\RDP\Desktop\MyProject\backend"

            if (Test-Path $srcMem) {
              Copy-Item -Path $srcMem -Destination "$dstDir\trade_memory.json" -Force -ErrorAction SilentlyContinue
            }
            if (Test-Path $srcCtx) {
              Copy-Item -Path $srcCtx -Destination "$dstDir\open_context.json" -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Upload bot memory and context before session ends
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-memory-state
          path: |
            C:\PolymarketBot_Platform\backend\trade_memory.json
            C:\PolymarketBot_Platform\backend\open_context.json
          if-no-files-found: ignore

      - name: Trigger next session if chain_count > 1
        if: always() && github.event_name == 'workflow_dispatch' && fromJson(inputs.chain_count) > 1
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $nextCount = [int]"${{ inputs.chain_count }}" - 1
          gh workflow run "RDP Trading Bot Chain (Tailscale + Memory Persistence)" --ref "${{ github.ref_name }}" -f chain_count="$nextCount"
