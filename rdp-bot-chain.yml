name: RDP Trading Bot Chain (Tailscale + Memory Persistence)

on:
  workflow_dispatch:
    inputs:
      chain_count:
        description: "Number of consecutive sessions to run (e.g., 2 = ~11 hours)"
        required: false
        default: "1"
  schedule:
    # تشغيل تلقائي كل 6 ساعات (يمكن تعديله حسب رصيد دقائق GitHub Actions)
    - cron: "0 */6 * * *"

jobs:
  run-rdp-bot:
    runs-on: windows-2022
    timeout-minutes: 350 # ~5.8 ساعات لتفادي القطع المفاجئ قبل حد 6 ساعات

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore bot memory and context from previous run
        uses: actions/download-artifact@v4
        with:
          name: bot-memory-state
          path: C:\PolymarketBot_Platform\backend
        continue-on-error: true

      - name: Connect Tailscale and prepare environment
        shell: pwsh
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          # تثبيت وتشغيل Tailscale والربط بشبكتك الخاصة
          if (-not (Get-Command tailscale -ErrorAction SilentlyContinue)) {
            choco install tailscale -y
          }
          Start-Service tailscaled -ErrorAction SilentlyContinue
          tailscale up --authkey="$env:TS_AUTHKEY" --hostname="rdp-gold-bot" --accept-dns=true

          # التأكد من وجود Python 3.12 لبيئة MetaTrader5
          if (-not (Test-Path "C:\Python312\python.exe")) {
            choco install python312 -y
          }

          # نسخ ملفات الذاكرة المسترجعة إلى مجلد الحفظ أيضاً إن وجدت
          $srcMem = "C:\PolymarketBot_Platform\backend\trade_memory.json"
          $srcCtx = "C:\PolymarketBot_Platform\backend\open_context.json"
          $dstDir = "C:\Users\RDP\Desktop\MyProject\backend"
          if (-not (Test-Path $dstDir)) { New-Item -ItemType Directory -Path $dstDir -Force | Out-Null }
          if (Test-Path $srcMem) { Copy-Item $srcMem -Destination "$dstDir\trade_memory.json" -Force }
          if (Test-Path $srcCtx) { Copy-Item $srcCtx -Destination "$dstDir\open_context.json" -Force }

          # تشغيل سكربت الإعداد الأساسي الخاص بك إن وجد
          if (Test-Path "$dstDir\..\setup_and_run.bat") {
            Start-Process cmd -ArgumentList "/c", "`"$dstDir\..\setup_and_run.bat`""
          }

      - name: Keep RDP session alive and sync memory before timeout
        shell: pwsh
        run: |
          # إبقاء الجلسة نشطة لمدة ~5 ساعات و35 دقيقة ثم مزامنة الذاكرة قبل الإغلاق
          $maxSeconds = 335 * 60
          $elapsed = 0
          while ($elapsed -lt $maxSeconds) {
            Start-Sleep -Seconds 60
            $elapsed += 60
            if (Test-Path "C:\PolymarketBot_Platform\backend\trade_memory.json") {
              Copy-Item "C:\PolymarketBot_Platform\backend\trade_memory.json" -Destination "C:\Users\RDP\Desktop\MyProject\backend\trade_memory.json" -Force -ErrorAction SilentlyContinue
            }
            if (Test-Path "C:\PolymarketBot_Platform\backend\open_context.json") {
              Copy-Item "C:\PolymarketBot_Platform\backend\open_context.json" -Destination "C:\Users\RDP\Desktop\MyProject\backend\open_context.json" -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Upload bot memory and context before session ends
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-memory-state
          path: |
            C:\PolymarketBot_Platform\backend\trade_memory.json
            C:\PolymarketBot_Platform\backend\open_context.json
          if-no-files-found: ignore

      - name: Trigger next session if chain_count > 1
        if: always() && github.event_name == 'workflow_dispatch' && fromJson(inputs.chain_count) > 1
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $nextCount = [int]"${{ inputs.chain_count }}" - 1
          gh workflow run "RDP Trading Bot Chain (Tailscale + Memory Persistence)" -f chain_count="$nextCount"
